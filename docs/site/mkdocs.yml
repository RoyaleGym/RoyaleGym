# The documentation site for the whole Royale family, not just this repo.
#
#   cd RoyaleGym/docs/site
#   ..\..\..\.venv\Scripts\python collect.py --root ..\..\..    # every repo's docs into pages/repos/
#   ..\..\..\.venv\Scripts\python -m mkdocs serve      # http://127.0.0.1:8000, live reload
#   ..\..\..\.venv\Scripts\python -m mkdocs build      # static HTML into _build/
#   ..\..\..\.venv\Scripts\python -m mkdocs gh-deploy  # publishes to GitHub Pages
#
# It lives in RoyaleGym because RoyaleGym is the front door of the project and the
# organisation is named after it, so a reader who finds one finds the other. Everything past a
# README is here: collect.py copies each repo's docs/ (read at origin/main in the sibling
# repos, so the site shows what is published) into pages/repos/ before a build.

site_name: RoyaleGym
site_description: Train Clash Royale bots with reinforcement learning. A fast battle engine, the environments to train in, a trainer and a viewer.
site_url: https://royalegym.github.io/RoyaleGym/
repo_url: https://github.com/RoyaleGym/RoyaleGym
repo_name: RoyaleGym
edit_uri: edit/main/docs/site/pages/

docs_dir: pages
site_dir: _build

theme:
  name: material
  # The home page's banner and cards (overrides/home.html).
  custom_dir: overrides
  language: en
  # The RoyaleGym mark (owner, 2026-10-02): the crown shield; the favicon is its simplified small form.
  logo: assets/royalegym-logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # The brand's royal blue and gold (stylesheets/extra.css defines "custom").
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Icons such as :material-rocket-launch: in a page, for the cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # Snippets are read from the repository root, so a page can include a file such as
  # examples/quickstart.py. A missing file is an error, not an empty box.
  - pymdownx.snippets:
      base_path: ["../.."]
      check_paths: true

# Pages copied in by collect.py get an edit link to the repo they came from.
hooks:
  - hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]

nav:
