      # Every repo's own docs, copied in by collect.py at build time (pages/repos/ is generated).
      - RoyaleSim:
          - Overview: repos/royalesim/README.md
          - In depth: repos/royalesim/engine.md
          - Python API: repos/royalesim/api.md
          - Architecture: repos/royalesim/architecture.md
          - Mechanics: repos/royalesim/mechanics.md
