      link: https://discord.gg/cuPQwyB7pd
      name: The project Discord
    - icon: simple/kofi
      link: https://ko-fi.com/jinxthecat
      name: Support RoyaleGym on Ko-fi

extra_css:
  - stylesheets/extra.css

# The header's repository box adds up the stars and forks of every public RoyaleGym repository.
extra_javascript:
  - javascripts/org-stats.js
  - javascripts/discord-online.js

not_in_nav: |
  /unverified.md
