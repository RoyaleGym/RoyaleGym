# The documentation site for the whole Royale family, not just this repo.
#
#   cd RoyaleGym/docs/site
#   ..\..\..\.venv\Scripts\python -m mkdocs serve      # http://127.0.0.1:8000, live reload
#   ..\..\..\.venv\Scripts\python -m mkdocs build      # static HTML into _build/
#   ..\..\..\.venv\Scripts\python -m mkdocs gh-deploy  # publishes to GitHub Pages
#
# It lives in RoyaleGym because RoyaleGym is the front door of the project and the
# organisation is named after it, so a reader who finds one finds the other. Nothing here
# imports from the sibling repos at build time; where a page needs the detail, it links to
# that repo's own docs rather than copying them.

site_name: Royale
site_description: Train Clash Royale bots with reinforcement learning. A fast battle engine, the environments to train in, a trainer and a viewer.
site_url: https://royalegym.github.io/RoyaleGym/
repo_url: https://github.com/RoyaleGym/RoyaleGym
repo_name: RoyaleGym
edit_uri: edit/main/docs/site/pages/

docs_dir: pages
site_dir: _build

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    # The viewer's own colours, so the site and the screenshots on it agree.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow my system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Snippets are read from the repository root, so a page can include a file such as
  # examples/quickstart.py. A missing file is an error, not an empty box.
  - pymdownx.snippets:
      base_path: ["../.."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            docstring_style: google
            filters: ["!^_"]

nav:
  - Getting Started:
      - Introduction: index.md
      - Install: install.md
      - Quick Start: quickstart.md
      - FAQ: faq.md
      - It Doesn't Work: it-doesnt-work.md
      - How It Fits Together: overview.md
  - Clash Royale:
      - Training an Agent: clash-royale/training-an-agent.md
      - Configuration Objects:
          - Action Parsers: clash-royale/configuration-objects/action-parsers.md
          - Done Conditions: clash-royale/configuration-objects/done-conditions.md
          - Observation Builders: clash-royale/configuration-objects/observation-builders.md
          - Opponents: clash-royale/configuration-objects/opponents.md
          - Reward Functions: clash-royale/configuration-objects/reward-functions.md
          - State Mutators: clash-royale/configuration-objects/state-mutators.md
          - Viewer: clash-royale/configuration-objects/viewer.md
  - Cheatsheets:
      - Game Values: cheatsheets/game-values.md
      - Reinforcement Learning Terms: cheatsheets/rl-terms.md
  - Additional Resources:
      - RoyaleSim: resources/royalesim.md
      - RoyaleLearn: resources/royalelearn.md
      - RoyaleViser: resources/royaleviser.md
      - RoyaleImitate: resources/royaleimitate.md
      - API Reference:
          - royalegym: reference/royalegym.md
          - royalelearn: reference/royalelearn.md
          - royaleviser: reference/royaleviser.md
  # Deep pages for contributors and the curious. Nothing in Getting Started links here.
  - Advanced:
      - How accurate is the engine: accuracy.md
      - The engine inside: pieces/engine.md
      - The environments inside: pieces/environments.md
      - The learner inside: pieces/learner.md
      - The viewer inside: pieces/viewer.md
      - Build from source: build-from-source.md
      - Troubleshooting in depth: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/4D2BS5JBHP
      name: The project Discord
    - icon: fontawesome/brands/github
      link: https://github.com/RoyaleGym
      name: The RoyaleGym organisation

not_in_nav: |
  /unverified.md
