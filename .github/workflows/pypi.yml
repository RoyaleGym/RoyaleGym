# Publish this package to PyPI from a version tag, with PyPI's trusted publishing (no API token).
# The upload job runs in the `pypi` environment, which waits for the owner's approval.
# PyPI's pending publisher for this project names this file (`pypi.yml`) and that environment.
name: pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "an existing version tag to publish, e.g. v0.1.1"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: the tag must be "v" + the version in this tree
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG holds version $VERSION: refusing to publish" >&2
            exit 1
          fi
      - name: build the wheel and the source archive
        run: |
          python -m pip install -q build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    # Off until the owner sets the repository variable PYPI_PUBLISH to true (Settings > Secrets and
    # variables > Actions > Variables), once the PyPI side is ready. Until then a tag builds and stops.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write  # trusted publishing; this job only
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
