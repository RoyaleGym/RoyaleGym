# The fresh-user test: a clean venv in a clean folder installs royalegym[all] the way a newcomer would, runs
# examples/quickstart.py, records a battle and opens it in the viewer headless. Nightly, on all three OSes.
# The main step installs RoyaleSim from its latest GitHub release's wheels and builds each sibling from its
# public repo into the same folder (pip --find-links). A missing prerequisite reports BLOCKED, which is not a pass.
name: fresh-user
# The run's name says which release it tested. pypi.yml reads it: a run named "fresh-user vX.Y.Z"
# that succeeds publishes that tag to PyPI, and a nightly run ("fresh-user") publishes nothing.
run-name: ${{ inputs.release_tag && format('fresh-user {0}', inputs.release_tag) || 'fresh-user' }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "a release (or pre-release) tag to test instead of the latest release, e.g. a candidate before it is promoted"
        required: false
        default: ""
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
        python: ['3.12', '3.13', '3.14']
    name: fresh (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: wheels -- royalesim from its release, the pure-Python siblings built from their repos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          gh release download -R RoyaleGym/RoyaleSim --pattern '*.whl' --dir "$RUNNER_TEMP/wheels" || true
          for repo in RoyaleLearn RoyaleViser RoyaleImitate; do
            python -m pip wheel --no-deps -q -w "$RUNNER_TEMP/wheels" "git+https://github.com/RoyaleGym/$repo@main"
          done
          ls -la "$RUNNER_TEMP/wheels"
      - name: fresh-user test
        shell: bash
        run: |
          # Run from an empty folder: the checkout is only the source pip copies, never on the path.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/fresh_user_test.py" --gym "$GITHUB_WORKSPACE" --wheels "$RUNNER_TEMP/wheels" \
            --steps 2000 --timeout 1200 --report "$GITHUB_WORKSPACE/fresh-user-${{ matrix.os }}-py${{ matrix.python }}.json"
      # The line the docs give: the latest RoyaleGym release, installed BY NAME from its page, with
      # the quickstart and README of that same tag. The step above tests main; this one tests what
      # a reader gets today.
      - name: the published install line (latest release, by name)
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$RELEASE_TAG"
          [ -n "$TAG" ] || TAG=$(gh release view -R RoyaleGym/RoyaleGym --json tagName -q .tagName)
          echo "testing the install line of $TAG"
          git -C "$GITHUB_WORKSPACE" fetch -q --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git -C "$GITHUB_WORKSPACE" worktree add -q "$RUNNER_TEMP/released" "$TAG"
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/fresh_user_test.py" --gym "$RUNNER_TEMP/released" --by-name \
            --wheels "https://github.com/RoyaleGym/RoyaleGym/releases/expanded_assets/$TAG" \
            --steps 2000 --timeout 1200 --report "$GITHUB_WORKSPACE/fresh-user-release-${{ matrix.os }}-py${{ matrix.python }}.json"
      # The line the docs give since every package is on PyPI: plain `pip install "royalegym[all]"`,
      # by name, with NO wheels folder and no release page, so pip takes all five from PyPI. It
      # runs the quickstart and README of the release tag checked out by the step above, and the
      # royalegym pip installs must be that tag's version. A release reaches PyPI only after this
      # gate passes (pypi.yml), so for a release PyPI does not have yet this step reports
      # NOT-PUBLISHED and runs nothing; pypi.yml installs the release by name once it uploads it,
      # and every nightly run tests the published line.
      - name: the PyPI install line (by name, no --find-links)
        if: always()
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          REPORT="$GITHUB_WORKSPACE/fresh-user-pypi-${{ matrix.os }}-py${{ matrix.python }}.json"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('released/pyproject.toml','rb'))['project']['version'])")
          if ! curl -sf -o /dev/null "https://pypi.org/pypi/royalegym/$VERSION/json"; then
            echo "royalegym $VERSION is not on PyPI yet: pypi.yml publishes it after this gate passes"
            printf '{"verdict": "NOT-PUBLISHED", "version": "%s"}\n' "$VERSION" > "$REPORT"
            exit 0
          fi
          python "$GITHUB_WORKSPACE/tools/fresh_user_test.py" --gym "$RUNNER_TEMP/released" --by-name \
            --expect-version "$VERSION" --steps 2000 --timeout 1200 --report "$REPORT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-user-${{ matrix.os }}-py${{ matrix.python }}
          path: fresh-user*-${{ matrix.os }}-py${{ matrix.python }}.json
