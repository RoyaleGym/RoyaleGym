# The fresh-user test: a clean venv in a clean folder installs royalegym[all] the way a newcomer would, runs
# examples/quickstart.py, records a battle and opens it in the viewer headless. Nightly, on all three OSes.
# RoyaleSim comes from its latest GitHub release's wheels. Until a package is on PyPI, its wheel is built from its
# public repo into the same folder (pip --find-links). A missing prerequisite reports BLOCKED, which is not a pass.
name: fresh-user

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

permissions:
  contents: read

jobs:
  fresh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: wheels -- royalesim from its release, the pure-Python siblings built from their repos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          gh release download -R RoyaleGym/RoyaleSim --pattern '*.whl' --dir "$RUNNER_TEMP/wheels" || true
          for repo in RoyaleLearn RoyaleViser RoyaleImitate; do
            python -m pip wheel --no-deps -q -w "$RUNNER_TEMP/wheels" "git+https://github.com/RoyaleGym/$repo@main"
          done
          ls -la "$RUNNER_TEMP/wheels"
      - name: fresh-user test
        shell: bash
        run: |
          # Run from an empty folder: the checkout is only the source pip copies, never on the path.
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/fresh_user_test.py" --gym "$GITHUB_WORKSPACE" --wheels "$RUNNER_TEMP/wheels" \
            --steps 2000 --timeout 1200 --report "$GITHUB_WORKSPACE/fresh-user-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-user-${{ matrix.os }}
          path: fresh-user-${{ matrix.os }}.json
