[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "royalegym"
version = "0.1.20"
description = "RoyaleGym: reinforcement-learning environments for Clash Royale, over the RoyaleSim battle engine"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.3,<2.0",
    "pettingzoo>=1.27,<2.0",
    "msgspec>=0.19",
]

[project.optional-dependencies]
# One install line for every piece: pip install "royalegym[all]".
# The engine (a prebuilt wheel; it carries its own data). The package imports without it
# (MockEngine is the pure-Python reference), and RustEngine() and make_env() say how to
# install it.
sim = ["royalesim>=0.1.24"]
# The learner, with PyTorch, which trains on a CPU.
learn = ["royalelearn[torch]>=0.5.16"]
# The viewer: watch a battle live or from a saved file.
viser = ["royaleviser>=0.1.2"]
# Imitation from replays.
imitate = ["royaleimitate[replays]>=0.2.12"]
# Every piece names a minimum, so `pip install --upgrade "royalegym[all]"` moves each one
# (pip upgrades a dependency only when a requirement forces it).
all = [
    "royalesim>=0.1.24",
    "royalelearn[torch]>=0.5.16",
    "royaleviser[media]>=0.1.2",
    "royaleimitate[replays]>=0.2.12",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.16",
]
train = [
    "sb3-contrib>=2.3",
]
# The documentation site, built from docs/site with `mkdocs serve` or `mkdocs build`.
docs = [
    "mkdocs-material>=9.7,<10",
    "mkdocstrings[python]>=1.0,<2",
]

[tool.setuptools]
packages = ["royalegym"]

[tool.setuptools.package-data]
# PEP 561: type checkers read an installed package's hints only when it ships this marker.
royalegym = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["slow: long-running rollouts"]
filterwarnings = [
    # pettingzoo's api test warns through gymnasium's logger on purpose for some checks
    "ignore::DeprecationWarning:pettingzoo.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["royalegym", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous unicode in comments/docstrings
    "SIM108",                       # ternaries are not always clearer
]

[tool.ruff.lint.per-file-ignores]
# An example unpacks the whole five-tuple a step returns even when it only reads the
# first entry, because seeing the shape IS what the example is for. Shortening it to
# `obs, *_ = env.step(...)` would lint better and teach worse.
"examples/*.py" = ["RUF059"]
# The quickstart imports its config objects in groups by what they do (the env, what the
# bot sees and does, what it is paid for, when a battle ends), so a reader sees which piece
# is which. One sorted block would teach the list and lose the grouping.
"examples/quickstart.py" = ["RUF059", "I001"]
# A VENDORED copy, kept byte-identical to the original in the cross-repo harness so the
# copies in the four public repos can be diffed against each other and against it. Every
# public repo carries its own, because a guard that lives only in the private repo cannot
# run for an outside contributor, who is the reader it protects. Reformatting it to this
# repo's line length would make that diff noisy for no behaviour change, so the line
# length is waived here and nothing else is.
"tests/_shell_fences.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["royalegym", "royalesim"]
